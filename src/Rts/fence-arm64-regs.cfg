; -*- mode: scheme -*-
;
; Configuration file for Fence register names, AArch64 (ARMv8-A).
;
; The register assignment is private between the Cant back end
; (src/Asm/Fence/pass5p2-arm64.sch) and the millicode support in
; src/Rts/Fence/arm64-millicode.s, which saves and restores the
; registers.
;
; The assignment avoids the platform register (x18), the frame
; pointer (x29), the link register (x30), and the stack pointer, all
; of which keep their C meanings while Scheme code runs.

(define-files "regs.ch" "regs.ah" "regs.sch")

; These are platform-invariant.

(define-const result    "-1" #f #f "$r.result")
(define-const second    "-2" #f #f "$r.second")
(define-const stkp      "-3" #f #f "$r.stkp")
(define-const globals   "-4" #f #f "$r.globals")
(define-const tmp       "-5" #f #f "$r.tmp")
(define-const reg0      "0"  #f #f "$r.reg0")

; AArch64 hardware register assignments for MacScheme registers.

(define-const arm64RESULT   "0" #f #f "arm64.RESULT")
(define-const arm64SECOND   "1" #f #f "arm64.SECOND")
(define-const arm64REG0     "2" #f #f "arm64.REG0")
(define-const arm64REG1     "3" #f #f "arm64.REG1")
(define-const arm64REG2     "4" #f #f "arm64.REG2")
(define-const arm64REG3     "5" #f #f "arm64.REG3")
(define-const arm64REG4     "6" #f #f "arm64.REG4")
(define-const arm64REG5     "7" #f #f "arm64.REG5")
(define-const arm64REG6     "8" #f #f "arm64.REG6")
(define-const arm64REG7     "9" #f #f "arm64.REG7")
(define-const arm64REG8    "10" #f #f "arm64.REG8")
(define-const arm64REG9    "11" #f #f "arm64.REG9")
(define-const arm64REG10   "12" #f #f "arm64.REG10")
(define-const arm64REG11   "13" #f #f "arm64.REG11")
(define-const arm64REG12   "14" #f #f "arm64.REG12")
(define-const arm64REG13   "15" #f #f "arm64.REG13")
(define-const arm64TMP1    "16" #f #f "arm64.TMP1")    ; Not exposed to pass5p2.
(define-const arm64TMP2    "17" #f #f "arm64.TMP2")    ; Not exposed to pass5p2.
(define-const arm64REG14   "19" #f #f "arm64.REG14")
(define-const arm64REG15   "20" #f #f "arm64.REG15")
(define-const arm64TMP0    "21" #f #f "arm64.TMP0")    ; This is $r.tmp in pass5p2.
(define-const arm64STKP    "22" #f #f "arm64.STKP")
(define-const arm64GLOBALS "23" #f #f "arm64.GLOBALS")

(define-const _result  (string-append "x" arm64RESULT)  #f "RESULT"  #f)
(define-const _second  (string-append "x" arm64SECOND)  #f "SECOND"  #f)
(define-const _reg0    (string-append "x" arm64REG0)    #f "REG0"    #f)
(define-const _reg1    (string-append "x" arm64REG1)    #f "REG1"    #f)
(define-const _reg2    (string-append "x" arm64REG2)    #f "REG2"    #f)
(define-const _reg3    (string-append "x" arm64REG3)    #f "REG3"    #f)
(define-const _reg4    (string-append "x" arm64REG4)    #f "REG4"    #f)
(define-const _reg5    (string-append "x" arm64REG5)    #f "REG5"    #f)
(define-const _reg6    (string-append "x" arm64REG6)    #f "REG6"    #f)
(define-const _reg7    (string-append "x" arm64REG7)    #f "REG7"    #f)
(define-const _reg8    (string-append "x" arm64REG8)    #f "REG8"    #f)
(define-const _reg9    (string-append "x" arm64REG9)    #f "REG9"    #f)
(define-const _reg10   (string-append "x" arm64REG10)   #f "REG10"   #f)
(define-const _reg11   (string-append "x" arm64REG11)   #f "REG11"   #f)
(define-const _reg12   (string-append "x" arm64REG12)   #f "REG12"   #f)
(define-const _reg13   (string-append "x" arm64REG13)   #f "REG13"   #f)
(define-const _reg14   (string-append "x" arm64REG14)   #f "REG14"   #f)
(define-const _reg15   (string-append "x" arm64REG15)   #f "REG15"   #f)
(define-const _tmp0    (string-append "x" arm64TMP0)    #f "TMP0"    #f)
(define-const _tmp1    (string-append "x" arm64TMP1)    #f "TMP1"    #f)
(define-const _tmp2    (string-append "x" arm64TMP2)    #f "TMP2"    #f)
(define-const _stkp    (string-append "x" arm64STKP)    #f "STKP"    #f)
(define-const _globals (string-append "x" arm64GLOBALS) #f "GLOBALS" #f)

(define-const _lastreg  "15" "LASTREG" "LASTREG" "*lastreg*")
(define-const _nregs    "16" "NREGS"   "NREGS"   "*nregs*")
(define-const _nhwregs  "16" #f        #f        "*nhwregs*")

; eof
