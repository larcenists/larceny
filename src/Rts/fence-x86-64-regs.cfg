; -*- mode: scheme -*-
;
; Configuration file for Fence register names, x86-64.
;
; The register assignment is private between the Cant back end
; (src/Asm/Fence/pass5p2-x86-64.sch) and the millicode support in
; src/Rts/Fence/x86-64-millicode.sx, which saves and restores the
; registers.
;
; rsp keeps its C meaning while Scheme code runs: Scheme code calls
; millicode with CALL, but changes rsp no other way.

(define-files "regs.ch" "regs.ah" "regs.sch")

; These are platform-invariant.

(define-const result    "-1" #f #f "$r.result")
(define-const second    "-2" #f #f "$r.second")
(define-const stkp      "-3" #f #f "$r.stkp")
(define-const globals   "-4" #f #f "$r.globals")
(define-const tmp       "-5" #f #f "$r.tmp")
(define-const reg0      "0"  #f #f "$r.reg0")

; x86-64 hardware register numbers for MacScheme registers.

(define-const x64TMP1     "0" #f #f "x86-64.TMP1")    ; rax; not exposed to pass5p2.
(define-const x64TMP0     "1" #f #f "x86-64.TMP0")    ; rcx; this is $r.tmp in pass5p2.
(define-const x64TMP2     "2" #f #f "x86-64.TMP2")    ; rdx; not exposed to pass5p2.
(define-const x64GLOBALS  "3" #f #f "x86-64.GLOBALS") ; rbx
(define-const x64STKP     "5" #f #f "x86-64.STKP")    ; rbp
(define-const x64RESULT   "6" #f #f "x86-64.RESULT")  ; rsi
(define-const x64SECOND   "7" #f #f "x86-64.SECOND")  ; rdi
(define-const x64REG0     "8" #f #f "x86-64.REG0")
(define-const x64REG1     "9" #f #f "x86-64.REG1")
(define-const x64REG2    "10" #f #f "x86-64.REG2")
(define-const x64REG3    "11" #f #f "x86-64.REG3")
(define-const x64REG4    "12" #f #f "x86-64.REG4")
(define-const x64REG5    "13" #f #f "x86-64.REG5")
(define-const x64REG6    "14" #f #f "x86-64.REG6")
(define-const x64REG7    "15" #f #f "x86-64.REG7")

; Register names for the millicode (GNU as, Intel syntax).

(define-const _tmp1    "rax" #f "TMP1"    #f)
(define-const _tmp0    "rcx" #f "TMP0"    #f)
(define-const _tmp2    "rdx" #f "TMP2"    #f)
(define-const _globals "rbx" #f "GLOBALS" #f)
(define-const _stkp    "rbp" #f "STKP"    #f)
(define-const _result  "rsi" #f "RESULT"  #f)
(define-const _second  "rdi" #f "SECOND"  #f)
(define-const _reg0    "r8"  #f "REG0"    #f)
(define-const _reg1    "r9"  #f "REG1"    #f)
(define-const _reg2    "r10" #f "REG2"    #f)
(define-const _reg3    "r11" #f "REG3"    #f)
(define-const _reg4    "r12" #f "REG4"    #f)
(define-const _reg5    "r13" #f "REG5"    #f)
(define-const _reg6    "r14" #f "REG6"    #f)
(define-const _reg7    "r15" #f "REG7"    #f)

(define-const _lastreg  "7" "LASTREG" "LASTREG" "*lastreg*")
(define-const _nregs    "8" "NREGS"   "NREGS"   "*nregs*")
(define-const _nhwregs  "8" #f        #f        "*nhwregs*")

; eof
